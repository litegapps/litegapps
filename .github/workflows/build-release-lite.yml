name: Build & Release LiteGapps (lite matrix)

# Builds the "lite" variant across every SDK (29-36) x arch (arm, arm64,
# x86, x86_64) combination in parallel, and publishes every zip produced to
# a single GitHub Release. lite has modules=false (no packages/ addon
# needed), so each combination is a fast, independent build - if a given
# arch/sdk combo has no gapps on the server, that one job just produces no
# asset (fail-fast: false keeps the rest of the matrix going).
#
# superlite is not built here - it's covered by build-release-full.yml
# (single arch/sdk target, all variants).
#
# Run manually from the Actions tab, or push a tag like "lite-v1".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created if missing). Leave empty to auto-generate."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "lite-v*"

permissions:
  contents: write

concurrency:
  group: build-release-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sdk: [29, 30, 31, 32, 33, 34, 35, 36]
        arch: [arm, arm64, x86, x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point lite at ${{ matrix.arch }}/${{ matrix.sdk }}
        run: |
          CFG="core/litegapps/lite/config"
          sed -i "s/^arch=.*/arch=${{ matrix.arch }}/" "$CFG"
          sed -i "s/^sdk=.*/sdk=${{ matrix.sdk }}/" "$CFG"
          sed -i "s/^restore.arch=.*/restore.arch=${{ matrix.arch }}/" "$CFG"
          sed -i "s/^restore.sdk=.*/restore.sdk=${{ matrix.sdk }}/" "$CFG"
          sed -i "s/^litegapps.restore=.*/litegapps.restore=lite/" config

      - name: Restore + build (skip quietly if this arch/sdk has no gapps on the server)
        run: |
          if ! sh build.sh restore; then
            echo "! No gapps available for ${{ matrix.arch }}/${{ matrix.sdk }} - skipping this combination"
            exit 0
          fi
          bash build.sh make litegapps lite "${{ matrix.arch }}" "${{ matrix.sdk }}" || true
          # flatten into dist/ - upload-artifact preserves the glob's parent
          # dirs (the date folder), which would nest zips on download instead
          # of landing them flat next to each other.
          mkdir -p dist
          find output -name "*.zip" -exec cp {} dist/ \;

      - name: Upload zip (if any was produced)
        uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.arch }}-${{ matrix.sdk }}
          path: dist/*.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag/prerelease
        id: vars
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="lite-build-$(date +%Y%m%d)-${{ github.run_number }}"
            fi
          fi
          PRERELEASE="${{ inputs.prerelease }}"
          if [ -z "$PRERELEASE" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download every combination's zip
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: lite-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          ls -la collected/ 2>/dev/null || true
          if [ -z "$(ls -A collected 2>/dev/null)" ]; then
            echo "! No zips were produced for any arch/sdk combination"
            exit 1
          fi
          cd collected && sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          NOTES="Automated LiteGapps lite build - SDK 29-36 x arm/arm64/x86/x86_64"
          PRERELEASE_FLAG=""
          [ "${{ steps.vars.outputs.prerelease }}" = "true" ] && PRERELEASE_FLAG="--prerelease"
          cd collected
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" *.zip SHA256SUMS.txt \
              --title "$TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG \
              --repo "${{ github.repository }}"
          fi
